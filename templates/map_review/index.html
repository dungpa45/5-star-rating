<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Star Rating</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-top">
                <h1>5 <i class="fas fa-star"></i> RATING </h1>
                <button id="dark-mode-toggle">
                    <i class="fas fa-moon"></i>
                    <span>Chế độ tối</span>
                </button>
            </div>
            <h4>Công cụ tạo đánh giá 5 sao tự động cho Google Maps</h4>
        </header>

        <div class="main-form">
            <div class="input-group">
                <label for="map-url"><i class="fas fa-map-marker-alt"></i> Nhập URL Google Maps:</label>
                <input type="text" id="map-url" placeholder="https://maps.app.goo.gl/...">
                <button id="generate-btn">
                    <i class="fas fa-magic"></i> Tạo Đánh Giá
                </button>
            </div>
            <div id="error-message" style="display:none;color:#d93025;font-weight:bold;margin-bottom:10px;"></div>

            <div class="options">
                <div class="option-group">
                    <label for="language"><i class="fas fa-language"></i> Ngôn ngữ:</label>
                    <select id="language">
                        <option value="vi">Tiếng Việt</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="option-group">
                    <label for="style"><i class="fas fa-paint-brush"></i> Phong cách đánh giá:</label>
                    <select id="style">
                        <option value="friendly">Thân thiện, đời thường</option>
                        <option value="professional">Chuyên nghiệp, chi tiết</option>
                        <option value="enthusiastic">Nhiệt tình, hào hứng</option>
                        <option value="concise">Ngắn gọn, súc tích</option>
                    </select>
                </div>
                <div class="option-group">
                    <label for="category"><i class="fas fa-tag"></i> Loại địa điểm:</label>
                    <select id="category">
                        <option value="restaurant">Nhà hàng / Quán ăn</option>
                        <option value="cafe">Quán cà phê</option>
                        <option value="hotel">Khách sạn</option>
                        <option value="spa">Spa / Làm đẹp</option>
                        <option value="shop">Cửa hàng / Mua sắm</option>
                        <option value="other">Khác</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>AI đang tạo đánh giá phù hợp...</p>
        </div>

        <div class="result-container" id="result-container" style="display: none;">
            <h2><i class="fas fa-map-pin"></i> Đánh giá mẫu cho: <span id="place-name"></span></h2>
            <div class="review-box">
                <div class="review-content" id="review-content"></div>
                <div class="review-actions">
                    <button id="copy-btn"><i class="fas fa-copy"></i> Sao chép</button>
                    <button id="rewrite-btn"><i class="fas fa-redo"></i> Viết lại</button>
                    <button id="new-review-btn"><i class="fas fa-plus"></i> Tạo mới</button>
                    <button id="edit-btn"><i class="fas fa-pen"></i> Sửa</button>
                </div>
            </div>
        </div>

        <footer>
            <p><a href="/" style="color:inherit;text-decoration:none;"><i class="fas fa-home"></i> Trang chủ</a></p>
        </footer>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const generateBtn = document.getElementById('generate-btn');
    const rewriteBtn = document.getElementById('rewrite-btn');
    const copyBtn = document.getElementById('copy-btn');
    const newReviewBtn = document.getElementById('new-review-btn');
    const editBtn = document.getElementById('edit-btn');
    const resultContainer = document.getElementById('result-container');
    const reviewContent = document.getElementById('review-content');
    const placeNameEl = document.getElementById('place-name');
    const loadingEl = document.getElementById('loading');
    const errorMessage = document.getElementById('error-message');
    const body = document.body;
    let isEditing = false;

    // Dark mode
    const isDark = localStorage.getItem('darkMode') === 'true';
    body.classList.toggle('dark-mode', isDark);
    document.getElementById('dark-mode-toggle').addEventListener('click', function() {
        const on = !body.classList.contains('dark-mode');
        body.classList.toggle('dark-mode', on);
        localStorage.setItem('darkMode', on);
    });

    document.getElementById('map-url').addEventListener('keydown', e => { if (e.key === 'Enter') generateBtn.click(); });

    function setLoading(on) {
        loadingEl.style.display = on ? 'flex' : 'none';
        if (on) resultContainer.style.display = 'none';
    }

    function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
    }

    function setEditing(on) {
        isEditing = on;
        reviewContent.contentEditable = on ? 'true' : 'false';
        editBtn.innerHTML = on ? '<i class="fas fa-save"></i> Lưu' : '<i class="fas fa-pen"></i> Sửa';
        if (on) reviewContent.focus();
    }

    async function callGenerate(previousReview = null) {
        const mapUrl = document.getElementById('map-url').value.trim();
        const language = document.getElementById('language').value;
        const style = document.getElementById('style').value;
        const category = document.getElementById('category').value;

        errorMessage.style.display = 'none';
        if (!mapUrl) { showError('Vui lòng nhập URL Google Maps'); return; }

        setLoading(true);
        try {
            const body = { map_url: mapUrl, language, style, category };
            if (previousReview) body.previous_review = previousReview;

            const res = await fetch('/maps/generate-review', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!data.success) { showError(data.error || 'Lỗi khi tạo đánh giá'); return; }

            placeNameEl.textContent = data.place_name;
            reviewContent.textContent = data.review;
            setEditing(false);
            resultContainer.style.display = 'block';
            resultContainer.scrollIntoView({ behavior: 'smooth' });
        } catch (e) {
            showError('Có lỗi xảy ra: ' + e.message);
        } finally {
            setLoading(false);
        }
    }

    generateBtn.addEventListener('click', () => callGenerate());
    rewriteBtn.addEventListener('click', () => callGenerate(reviewContent.textContent.trim() || null));
    editBtn.addEventListener('click', () => setEditing(!isEditing));
    newReviewBtn.addEventListener('click', () => {
        document.getElementById('map-url').value = '';
        resultContainer.style.display = 'none';
        setEditing(false);
        document.getElementById('map-url').focus();
    });
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(reviewContent.textContent);
        copyBtn.innerHTML = '<i class="fas fa-check"></i> Đã sao chép!';
        copyBtn.style.backgroundColor = '#34A853';
        setTimeout(() => { copyBtn.innerHTML = '<i class="fas fa-copy"></i> Sao chép'; copyBtn.style.backgroundColor = ''; }, 2000);
    });

    // Restore session
    fetch('/maps/get-session-review')
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                placeNameEl.textContent = data.place_name;
                reviewContent.textContent = data.review;
                resultContainer.style.display = 'block';
            }
        });
});
</script>
</body>
</html>
