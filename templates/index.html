<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Review Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-size: 2rem; margin-bottom: 8px; text-align: center; }
        p.sub { color: #888; margin-bottom: 40px; text-align: center; }
        .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
        .card { background: #1a1a1a; border-radius: 16px; padding: 36px 32px; width: 260px; text-align: center; text-decoration: none; color: #e0e0e0; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #2a2a2a; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .card i { font-size: 3rem; margin-bottom: 16px; display: block; }
        .card.maps i { color: #4285f4; }
        .card.youtube i { color: #ff0000; }
        .card h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .card p { font-size: 0.88rem; color: #888; }
        footer { margin-top: 48px; color: #444; font-size: 0.82rem; }
    </style>
</head>
<body>
    <h1>🤖 AI Review Hub</h1>
    <p class="sub">Chọn công cụ tạo đánh giá bạn muốn sử dụng</p>
    <div class="cards">
        <a class="card maps" href="/maps/" target="_blank">
            <i class="fas fa-map-marker-alt"></i>
            <h2>5-Star Rating</h2>
            <p>Tạo đánh giá 5 sao cho địa điểm trên Google Maps</p>
        </a>
        <a class="card youtube" href="/youtube/" target="_blank">
            <i class="fab fa-youtube"></i>
            <h2>YouTube Review</h2>
            <p>Tạo bình luận tích cực cho video YouTube bằng AI</p>
        </a>
    </div>
    <footer>AI Review Hub &mdash; Powered by OpenAI</footer>
</body>
</html>
